*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a111c;font-family:'Figtree','Segoe UI',Roboto,Arial,sans-serif;color:#e9eefb}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:linear-gradient(160deg,#101a2a,#0c1422 60%,#0a111c)}
#stage>*,#dyn>*{position:absolute}
.pn>*,.bx>*{position:absolute}
.pn{background:linear-gradient(180deg,#17233a,#121c2e);border:1px solid #26354f;border-radius:16px;overflow:hidden}
.pt{left:18px;top:14px;font-size:14px;font-weight:600;color:#f1f5ff;white-space:nowrap}
.mut{color:#8393b5}.tl{color:#f5a524}
svg{display:block;overflow:visible}
svg text{font-family:'Figtree','Segoe UI',Arial,sans-serif}
.lang{width:42px;height:28px;line-height:26px;text-align:center;border:1px solid #2c3b57;background:#121c2e;color:#9db0d6;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:8px}
.lang:hover{color:#fff;border-color:#f5a524}.lang.on{background:#f5a524;border-color:#f5a524;color:#2a1a00}
.chip{display:flex;align-items:center;justify-content:center;height:26px;border:1px solid #2c3b57;background:#121c2e;color:#9db0d6;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;border-radius:8px}
.chip:hover{color:#fff;border-color:#f5a524}
.chip.on{background:#f5a524;border-color:#f5a524;color:#2a1a00}
.chip.all{background:#1c1a1a;border-color:#5a4416;color:#ffd993}
.chip.na{background:#0a111c;color:#415076;border-color:#212b45;cursor:default}
.sm{display:flex;align-items:center;justify-content:center;height:24px;padding:0 10px;border:1px solid #2c3b57;background:#121c2e;color:#9db0d6;font-size:11.5px;font-weight:600;cursor:pointer;border-radius:7px;white-space:nowrap}
.sm:hover{color:#fff;border-color:#f5a524}.sm.on{background:#f5a524;border-color:#f5a524;color:#2a1a00}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:28px;border:1px solid #2c3b57;background:#121c2e;color:#e4ebfb;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;white-space:nowrap}
.btn:hover{border-color:#f5a524;color:#fff}
.tm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid #26354f;background:linear-gradient(180deg,#17233a,#121c2e);color:#9db0d6;font-size:12px;font-weight:600;cursor:pointer;border-radius:14px;user-select:none;white-space:nowrap}
.tm:hover{color:#fff;border-color:#f5a524}.tm.on{border-color:#f5a524;color:#fff;background:linear-gradient(180deg,#4a3612,#3a2a0e)}
.mt{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid rgba(255,255,255,.22);background:rgba(10,24,40,.38);color:#e9f6fb;font-size:12px;font-weight:600;cursor:pointer;border-radius:9px;white-space:nowrap}
.mt:hover{border-color:#fff}.mt.on{background:#fff;color:#0d3340;border-color:#fff}
.pill{display:flex;align-items:center;justify-content:center;height:26px;border-radius:8px;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;border:1px solid}
.pill.em{background:#121c2e;border-color:#2c3b57;color:#dbe5fb}
.pill.yt{background:rgba(230,33,23,.13);border-color:rgba(230,33,23,.4);color:#f2857d}.pill.li{background:rgba(10,102,194,.2);border-color:rgba(60,150,230,.5);color:#8cc2f2}.pill.pf{background:rgba(245,165,36,.12);border-color:rgba(245,165,36,.4);color:#ffd08a}.pill.wa{background:rgba(31,168,85,.14);border-color:rgba(31,168,85,.42);color:#6bcf94}
.pill:hover{filter:brightness(1.3)}
.hit{pointer-events:auto;cursor:pointer}
.rw{cursor:pointer}
.sp{display:flex;align-items:center;justify-content:center;height:20px;padding:0 9px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#0a111c;border:1px solid #f5a524;color:#f0f4ff;font:600 12.5px 'Figtree','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:7px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1300px,96vw);height:min(720px,88vh);background:#0e1626;border:1px solid #f5a524;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;font-family:'Figtree','Segoe UI',Arial,sans-serif}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#121c2e;border-bottom:1px solid #26354f}
#sheet .tp b{flex:1;font-size:16px;color:#ffd08a}
#sheet button{height:30px;padding:0 14px;border:1px solid #f5a524;border-radius:8px;background:#33270f;color:#fff;font-weight:600;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#f5a524;color:#2a1a00}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:12.5px;width:100%}
#sheet th{position:sticky;top:0;background:#121c2e;color:#ffd993;padding:6px 9px;text-align:right;white-space:nowrap;border:1px solid #26354f}
#sheet td{padding:4px 9px;border:1px solid #1d2a42;text-align:right;color:#e4ebfb;white-space:nowrap}
#sheet th:nth-child(-n+3),#sheet td:nth-child(-n+3){text-align:left}
#sheet tr:nth-child(even) td{background:#111b2d}
#sheet td[contenteditable]:focus{outline:2px solid #f5a524;background:#33270f}
</style></head>
